// Every dependency is compileOnly: the annotations are SOURCE-retention and the api contract supplies
// only the typed-key interface. So this module's jar carries neither, and no :teavm module embeds a
// second copy of either.
dependencies {
    compileOnly project(":annotations")
    compileOnly project(":contract")
    annotationProcessor project(":processor")
}

tasks.named("compileJava") {
    options.compilerArgs += [
        "-Atsemit.name=ir-contracts",
        "-Atsemit.ext=.ts",
        "-Atsemit.keys=@intisy-ai/api/contract",
        "-Atsemit.imports=../types.js=FrontDoorCapability",
    ]
}
